format = """
[╭─](bold bright-black)$os$username[@](bold bright-black)$hostname $directory$git_branch$git_status$fill$cmd_duration
[╰─](bold bright-black)$character"""

[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold blue"

[os.symbols]
Arch = "󰣇"

[username]
style_user = "bold purple"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "bold cyan"
format = "[$hostname]($style)"

[directory]
style = "bold cyan"
read_only = " 󰌾"
truncate_to_repo = true
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰟲 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[$duration]($style)"
style = "bold yellow"

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[docker_context]
disabled = true
